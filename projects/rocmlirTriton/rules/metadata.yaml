rules:
  - name: project-overview
    description: "rocmlirTriton project overview, architecture, Triton submodule, confidentiality, and downstream awareness. Essential context for every conversation."
    alwaysApply: true

  - name: triton-integration
    description: "Triton submodule integration, the Rock<->Triton bridge passes (RockToTTIR, RockFuncToTritonFunc), LLVM build flow via Triton, local patches, and Python-to-C++ replication points."
    globs: "mlir/lib/Dialect/Rock/Pipelines/Pipelines.cpp,mlir/lib/Dialect/Rock/Transforms/RockToTTIR.cpp,mlir/lib/Dialect/Rock/Transforms/FuncToTritonFunc.cpp,mlir/lib/Dialect/Rock/Transforms/SerializeHostFuncs.cpp,mlir/lib/Dialect/Rock/Transforms/RestoreHostCode.cpp,mlir/lib/Translation/**/*.cpp,mlir/lib/Dialect/Rock/utility/tritonUtils.*,mlir/lib/Dialect/Rock/IR/AmdArchDb.cpp,triton-patches/**/*,scripts/build-llvm.sh,cmake/triton.cmake,.gitmodules"

  - name: llvm-cpp-standards
    description: "LLVM/MLIR C++ coding standards: casting, ADT types, error handling, naming, includes, namespaces."
    globs: "mlir/**/*.cpp,mlir/**/*.h"

  - name: cmake-conventions
    description: "CMake build system patterns and rocmlirTriton helper functions, MLIR_DIR/Triton wiring."
    globs: "**/CMakeLists.txt,**/*.cmake"

  - name: python-standards
    description: "Python coding standards enforced by CI: yapf formatting, flake8 linting."
    globs: "mlir/**/*.py,scripts/**/*.py"

  - name: code-review
    description: "Code review checklist with severity levels, license headers, confidentiality, Triton sync awareness, and temp file rules."
    alwaysApply: true

  - name: testing-conventions
    description: "Testing patterns: Lit tests, GoogleTest, E2E tests via tests.sh, FileCheck, fusion test suites."
    globs: "mlir/test/**/*,tests*.sh"

  - name: rocmlir-tools
    description: "CLI reference for rocmlir-gen, rocmlir-driver, rocmlir-opt, rocmlir-tuning-driver, rocmlir-translate."
    globs: "mlir/tools/**/*.cpp"

  - name: dev-workflow
    description: "Step-by-step guides for adding ops, passes, conversions, Triton-aware lowering, and debugging."
    globs: "mlir/**/*.cpp,mlir/**/*.h,mlir/**/*.td"

  - name: ci-pipelines
    description: "CI conventions for Jenkins, Azure Pipelines, and GitHub Actions in rocmlirTriton."
    globs: "mlir/utils/jenkins/Jenkinsfile*,.azuredevops/*,.github/workflows/*"

  - name: skill-dispatch
    description: "Check available skills before starting a task and follow the matching skill's process."
    alwaysApply: true
